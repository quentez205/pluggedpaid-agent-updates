<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plugged &amp; Paid</title>
  <meta name="description" content="Plugged and Paid. Systems-first digital automation.">
  <style>
    :root {
      --bg: #f4f4ef;
      --fg: #0b0b0b;
      --muted: #5d5d57;
      --card: #ffffff;
      --border: #0b0b0b;
      --accent: #3d7bff;
      --accent-fg: #ffffff;
      --glow: rgba(61, 123, 255, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0a0a;
        --fg: #f5f5f0;
        --muted: #9b9b94;
        --card: #141414;
        --border: #2b2b2b;
        --accent: #c6ff3d;
        --accent-fg: #0a0a0a;
        --glow: rgba(198, 255, 61, 0.18);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #f5f5f0;
      --muted: #9b9b94;
      --card: #141414;
      --border: #2b2b2b;
      --accent: #c6ff3d;
      --accent-fg: #0a0a0a;
      --glow: rgba(198, 255, 61, 0.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% -10%, var(--glow), transparent 60%);
      background-repeat: no-repeat;
    }
    main {
      max-width: 460px;
      margin: 0 auto;
      padding: 64px 16px 40px;
    }

    header { text-align: center; margin-bottom: 36px; }
    .mark {
      width: 96px; height: 96px;
      margin: 0 auto 18px;
      border-radius: 28px;
      background: var(--accent);
      color: var(--accent-fg);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -1px;
      box-shadow: 0 12px 40px var(--glow);
      transform: rotate(-4deg);
    }
    .hero-char {
      display: block;
      width: 170px;
      height: auto;
      margin: 0 auto 8px;
      filter: drop-shadow(0 16px 24px var(--glow));
      animation: float 4s ease-in-out infinite;
    }
    .hero-stage { position: relative; width: 260px; height: 300px; margin: 0 auto 8px; }
    .hero-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-stage .hero-char { width: 170px; margin: 0 auto; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .hero-stage.is-3d .hero-char { display: none; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-char { animation: none; }
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 8px;
    }
    .tagline { color: var(--muted); margin: 0 auto; font-size: 15px; max-width: 320px; }

    .tag {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    nav { display: flex; flex-direction: column; gap: 12px; }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--fg);
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0 var(--border);
      outline: none;
    }
    .link:active { transform: translateY(0); box-shadow: none; }
    .link.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }
    .link .icon {
      flex: none;
      width: 40px; height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
    }
    .link.primary .icon { background: var(--accent-fg); color: var(--accent); }
    .link .text { flex: 1; min-width: 0; }
    .link .label { display: block; font-weight: 700; font-size: 16px; }
    .link .note { display: block; font-size: 13px; opacity: 0.7; }
    .link .arrow { flex: none; font-size: 18px; opacity: 0.6; }
    .link svg { width: 20px; height: 20px; }

    footer {
      margin-top: 44px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="hero-stage">
        <img class="hero-char" src="character-full.png" alt="Plugged &amp; Paid character">
      </div>

      <h1>Plugged &amp; Paid</h1>
      <p class="tagline">Systems-first digital automation. Build it once, let it run.</p>
      <span class="tag">Accepting new clients</span>
    </header>

    <!-- Edit this list. Each entry: label, url, icon (key from ICONS), optional note, optional primary flag. -->
    <nav id="links" aria-label="Links"></nav>

    <footer>
      <p>&copy; <span id="year"></span> Plugged &amp; Paid</p>
    </footer>
  </main>

  <script>
    const ICONS = {
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
      layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>',
      gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>'
    };

    const LINKS = [
      { label: "Book a call", url: "https://example.com/book", icon: "calendar", note: "Free 20-minute workflow review", primary: true },
      { label: "Services", url: "https://example.com/services", icon: "layers", note: "What I build and how it works" },
      { label: "Free resource", url: "https://example.com/resource", icon: "gift", note: "Replace with your lead magnet" },
      { label: "Instagram", url: "https://instagram.com/yourhandle", icon: "instagram" },
      { label: "YouTube", url: "https://youtube.com/@yourhandle", icon: "youtube" },
      { label: "Contact", url: "mailto:you@example.com", icon: "mail" }
    ];

    const nav = document.getElementById("links");
    for (const item of LINKS) {
      const a = document.createElement("a");
      a.className = "link" + (item.primary ? " primary" : "");
      a.href = item.url;

      const icon = document.createElement("span");
      icon.className = "icon";
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = ICONS[item.icon] || "";

      const text = document.createElement("span");
      text.className = "text";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.label;
      text.appendChild(label);
      if (item.note) {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = item.note;
        text.appendChild(note);
      }

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";

      a.append(icon, text, arrow);
      if (item.url.startsWith("http")) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      nav.appendChild(a);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script type="module">
    const stage = document.querySelector(".hero-stage");
    let THREE;
    try {
      THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
    } catch (err) {
      console.warn("3D character unavailable, showing picture instead", err);
    }

    if (THREE && stage) {
      try {
        const MAG = 0x9c1f5e, PURP = 0x5b2a86, BLUE = 0x3c9be6, SKIN = 0x8b5a3a;
        const LOC = 0x2a1a10, WHITE = 0xf2f2ee, SHOE = 0x5a3a24, GLASS = 0xbfe6ff;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(260, 300);
        const canvas = renderer.domElement;
        canvas.setAttribute("aria-hidden", "true");
        stage.prepend(canvas);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 260 / 300, 0.1, 50);
        camera.position.set(0, 1.3, 5.4);
        camera.lookAt(0, 1.3, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const key = new THREE.DirectionalLight(0xffffff, 1.6);
        key.position.set(2, 3, 4);
        scene.add(key);

        const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05, ...extra });
        const add = (parent, geo, mat, x = 0, y = 0, z = 0) => {
          const m = new THREE.Mesh(geo, mat);
          m.position.set(x, y, z);
          parent.add(m);
          return m;
        };

        const figure = new THREE.Group();
        scene.add(figure);

        // Torso, shirt, bow tie, tail coat
        add(figure, new THREE.BoxGeometry(0.62, 0.72, 0.36), std(MAG), 0, 1.22, 0);
        add(figure, new THREE.BoxGeometry(0.2, 0.5, 0.02), std(WHITE), 0, 1.3, 0.19);
        const tieL = add(figure, new THREE.ConeGeometry(0.07, 0.12, 10), std(BLUE), -0.06, 1.55, 0.2);
        tieL.rotation.z = Math.PI / 2;
        const tieR = add(figure, new THREE.ConeGeometry(0.07, 0.12, 10), std(BLUE), 0.06, 1.55, 0.2);
        tieR.rotation.z = -Math.PI / 2;
        add(figure, new THREE.SphereGeometry(0.03, 10, 8), std(BLUE), 0, 1.55, 0.21);
        add(figure, new THREE.BoxGeometry(0.58, 0.42, 0.05), std(MAG), 0, 0.82, -0.2);

        // Head, locs, face
        const head = new THREE.Group();
        head.position.set(0, 1.8, 0);
        figure.add(head);
        add(head, new THREE.SphereGeometry(0.27, 24, 18), std(SKIN), 0, 0.02, 0).scale.set(1, 1.05, 1);
        for (let i = 0; i < 46; i++) {
          const a = (i / 46) * Math.PI * 2;
          const r = 0.28 + (i % 3) * 0.015;
          const y = 0.15 + ((i * 37) % 11) / 40;
          const loc = add(head, new THREE.CapsuleGeometry(0.035, 0.22, 4, 8), std(LOC), Math.cos(a) * r, y - 0.1, Math.sin(a) * r * 0.85);
          loc.rotation.x = Math.PI * 0.05;
        }
        add(head, new THREE.BoxGeometry(0.12, 0.025, 0.03), std(LOC), 0, -0.1, 0.27);
        add(head, new THREE.SphereGeometry(0.035, 10, 8), std(0xffffff), -0.1, 0.05, 0.25);
        add(head, new THREE.SphereGeometry(0.035, 10, 8), std(0xffffff), 0.1, 0.05, 0.25);
        add(head, new THREE.SphereGeometry(0.018, 8, 6), std(0x222222), -0.1, 0.05, 0.28);
        add(head, new THREE.SphereGeometry(0.018, 8, 6), std(0x222222), 0.1, 0.05, 0.28);
        for (const x of [-0.11, 0.11]) {
          const lens = add(head, new THREE.TorusGeometry(0.085, 0.012, 8, 24), std(GLASS, { metalness: 0.6, roughness: 0.2 }), x, 0.05, 0.25);
          lens.rotation.y = 0;
        }
        add(head, new THREE.BoxGeometry(0.05, 0.012, 0.012), std(GLASS, { metalness: 0.6 }), 0, 0.05, 0.25);

        // Hat
        add(head, new THREE.CylinderGeometry(0.34, 0.34, 0.04, 28), std(PURP), 0, 0.26, 0);
        add(head, new THREE.CylinderGeometry(0.22, 0.22, 0.42, 28), std(PURP), 0, 0.5, 0);
        add(head, new THREE.CylinderGeometry(0.225, 0.225, 0.06, 28), std(0x111111), 0, 0.3, 0);

        // Arms (pivot at shoulder)
        const makeArm = (x) => {
          const pivot = new THREE.Group();
          pivot.position.set(x, 1.5, 0);
          figure.add(pivot);
          add(pivot, new THREE.BoxGeometry(0.17, 0.62, 0.17), std(MAG), 0, -0.31, 0);
          add(pivot, new THREE.SphereGeometry(0.085, 14, 10), std(SKIN), 0, -0.7, 0);
          return pivot;
        };
        const armL = makeArm(-0.4);
        const armR = makeArm(0.4);

        // Legs (pivot at hip)
        const makeLeg = (x) => {
          const pivot = new THREE.Group();
          pivot.position.set(x, 0.86, 0);
          figure.add(pivot);
          add(pivot, new THREE.BoxGeometry(0.2, 0.84, 0.2), std(MAG), 0, -0.42, 0);
          add(pivot, new THREE.BoxGeometry(0.22, 0.12, 0.36), std(SHOE), 0, -0.9, 0.06);
          return pivot;
        };
        const legL = makeLeg(-0.16);
        const legR = makeLeg(0.16);

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const clock = new THREE.Clock();
        let t = 0;

        const pose = (time, walking) => {
          const phase = time * 4.2;
          const swing = walking ? Math.sin(phase) : 0;
          legL.rotation.x = swing * 0.55;
          legR.rotation.x = -swing * 0.55;
          armL.rotation.x = -swing * 0.45;
          armR.rotation.x = swing * 0.45;
          figure.position.y = walking ? Math.abs(Math.sin(phase)) * 0.04 : 0;
          const x = walking ? Math.sin(time * 0.45) * 0.7 : 0;
          const dx = walking ? Math.cos(time * 0.45) * 0.45 : 0;
          figure.position.x = x;
          figure.rotation.y = walking ? Math.atan2(dx, 0.5) * 0.9 : 0;
        };

        const frame = () => {
          const dt = Math.min(clock.getDelta(), 0.05);
          if (!reduceMotion) t += dt;
          pose(t, !reduceMotion);
          renderer.render(scene, camera);
          requestAnimationFrame(frame);
        };

        renderer.render(scene, camera);
        stage.classList.add("is-3d");
        if (!reduceMotion) requestAnimationFrame(frame);
      } catch (err) {
        console.warn("3D character failed, showing picture instead", err);
        stage.classList.remove("is-3d");
      }
    }
  </script>
</body>
</html>
