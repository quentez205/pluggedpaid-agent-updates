<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plugged &amp; Paid</title>
  <meta name="description" content="Plugged & Paid. Systems-first digital automation.">
  <style>
    :root {
      --bg: #f6f6f4;
      --fg: #111111;
      --muted: #5c5c5c;
      --card: #ffffff;
      --border: #dcdcd8;
      --accent: #111111;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0e0e;
        --fg: #f2f2f0;
        --muted: #9a9a96;
        --card: #171717;
        --border: #2a2a2a;
        --accent: #f2f2f0;
        --accent-fg: #0e0e0e;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0e0e;
      --fg: #f2f2f0;
      --muted: #9a9a96;
      --card: #171717;
      --border: #2a2a2a;
      --accent: #f2f2f0;
      --accent-fg: #0e0e0e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 56px 16px 40px;
    }
    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--accent); color: var(--accent-fg);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 26px; letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .tagline { color: var(--muted); margin: 0; font-size: 15px; }

    nav { display: flex; flex-direction: column; gap: 12px; }
    .link {
      display: block;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--fg);
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      transition: transform 0.08s ease, border-color 0.15s ease;
    }
    .link:hover, .link:focus-visible { border-color: var(--fg); outline: none; }
    .link:active { transform: scale(0.99); }
    .link small {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">P&amp;P</div>
      <h1>Plugged &amp; Paid</h1>
      <p class="tagline">Systems-first digital automation. Build it once, let it run.</p>
    </header>

    <!-- Edit this list. Each entry: label, url, optional note. -->
    <nav id="links" aria-label="Links"></nav>

    <footer>
      <p>&copy; <span id="year"></span> Plugged &amp; Paid</p>
    </footer>
  </main>

  <script>
    const LINKS = [
      { label: "Book a call", url: "https://example.com/book", note: "Free 20-minute workflow review" },
      { label: "Services", url: "https://example.com/services", note: "What I build and how it works" },
      { label: "Free resource", url: "https://example.com/resource", note: "Replace with your lead magnet" },
      { label: "Instagram", url: "https://instagram.com/yourhandle" },
      { label: "YouTube", url: "https://youtube.com/@yourhandle" },
      { label: "Contact", url: "mailto:you@example.com" }
    ];

    const nav = document.getElementById("links");
    for (const item of LINKS) {
      const a = document.createElement("a");
      a.className = "link";
      a.href = item.url;
      a.textContent = item.label;
      if (item.note) {
        const small = document.createElement("small");
        small.textContent = item.note;
        a.appendChild(small);
      }
      if (item.url.startsWith("http")) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      nav.appendChild(a);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
